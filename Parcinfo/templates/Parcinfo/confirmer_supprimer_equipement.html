{% extends "base.html" %}

{% block content %}

<div class="max-w-xl mx-auto bg-white shadow rounded-lg p-6">
    <h2 class="text-2xl font-bold mb-2">Confirmer la suppression</h2>
    <p class="text-gray-600 mb-6">
        Êtes-vous sûr de vouloir supprimer <span class="font-semibold">{{ equipement.nom }}</span> ?
        Cette action est irréversible.
    </p>

    <form method="post">
        {% csrf_token %}
        <div class="flex gap-2">
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">
                Supprimer
            </button>
            <a href="{% url 'liste_equipements' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-900 px-4 py-2 rounded">
                Annuler
            </a>
        </div>
    </form>
</div>

{% endblock %}
