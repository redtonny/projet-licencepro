{% extends "base.html" %}

{% block content %}

<div class="p-6 max-w-md mx-auto" id="assign-form">
    <h3 class="text-xl font-bold dark:text-white mb-4">Assigner Ticket #{{ ticket.id }}</h3>
    <p class="text-gray-600 dark:text-gray-400 mb-6"><strong>{{ ticket.titre }}</strong> - {{ ticket.statut|title }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}

        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Technicien</label>
            {{ form.technicien }}
            {{ form.technicien.errors }}
        </div>

        <div class="mb-8">
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Statut</label>
            {{ form.statut }}
            {{ form.statut.errors }}
        </div>

        <div class="flex gap-3">
            <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-6 rounded-xl shadow-lg transition">
                Enregistrer
            </button>
            <a href="{% url 'liste_tickets' %}"
               class="flex-1 bg-gray-300 hover:bg-gray-400 dark:bg-gray-600 dark:hover:bg-gray-500 text-gray-800 dark:text-gray-200 font-medium py-3 px-6 rounded-xl shadow-lg transition inline-flex items-center justify-center">
                Annuler
            </a>
        </div>
    </form>
</div>

{% endblock %}
