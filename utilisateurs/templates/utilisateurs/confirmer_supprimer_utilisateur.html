{% extends "base.html" %}

{% block content %}

<div class="max-w-xl mx-auto bg-white shadow rounded-lg p-6">
    <h2 class="text-2xl font-bold mb-2">Confirmer la suppression</h2>
    <p class="text-gray-600 mb-6">
        Supprimer <span class="font-semibold">{{ user_to_delete.username }}</span> ?
        <span class="block text-sm text-gray-500 mt-1">Action irréversible.</span>
    </p>

    <form method="post">
        {% csrf_token %}
        <div class="flex gap-2">
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg">
                Supprimer
            </button>
            <a href="{% url 'gerer_utilisateurs' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-900 px-4 py-2 rounded-lg">
                Annuler
            </a>
        </div>
    </form>
</div>

{% endblock %}
